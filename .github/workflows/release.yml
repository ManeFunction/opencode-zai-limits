# Tag vX.Y.Z -> CI -> tag/version check -> npm pack + smoke test -> npm publish (trusted publishing,
# provenance) -> GitHub release with the tarball attached.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches package.json
        run: python3 .github/scripts/check_version.py

  build:
    needs: [test, check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Build and type-check
        run: npm run typecheck

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Smoke test the tarball
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/pkg
          tar -xzf "opencode-zai-limits-${TAG_VERSION}.tgz" -C /tmp/pkg
          PKG_VERSION=$(node -p "require('/tmp/pkg/package/package.json').version")
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"
          test -f /tmp/pkg/package/src/tui.tsx
          test -f /tmp/pkg/package/dist/tui-support.js
          node -e "import('/tmp/pkg/package/dist/index.js').then((m) => { if (typeof m.default !== 'object') process.exit(1) })"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing (no stored npm token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+; fail loudly instead of with ENEEDAUTH.
      - name: Check the npm version
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"

      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      # A re-run after a partly failed release must not die on "version already exists"; the first
      # version is also published by hand, before trusted publishing can be configured.
      - name: Publish to npm (provenance is automatic with trusted publishing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "opencode-zai-limits@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "opencode-zai-limits@${VERSION} is already on npm, skipping."
          else
            npm publish --access public # prepublishOnly rebuilds dist/ and type-checks
          fi

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags -- needed to diff against the previous release tag

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist/

      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > auto_notes.md

          # CHANGELOG intro of this version (text above its first ### heading), then the auto notes,
          # then Features/Fixes/Refactor from the commits since the previous tag.
          python3 .github/scripts/release_notes.py --auto-notes auto_notes.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md
