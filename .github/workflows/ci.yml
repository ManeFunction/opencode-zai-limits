name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml so a tag can't ship with a failing build

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Build-time only, nothing ships: the TypeScript compiler and Node types, plus
      # Babel (@babel/core, @babel/preset-typescript, babel-preset-solid) to compile
      # src/tui.tsx to dist/tui.js. Nothing needs install scripts.
      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # The server part, then src/tui.tsx against the declarations just emitted.
      - name: Type-check
        run: npm run typecheck

      # There is no test suite yet: the built entry points are the check. The
      # ./tui export must stay precompiled: OpenCode's Solid transform skips
      # node_modules, so a shipped .tsx would be compiled as React JSX.
      # dist/tui.js needs OpenCode's runtime modules, so it is checked statically: it
      # parses, its relative imports resolve, it imports only host-provided modules and
      # uses only helpers OpenCode's @opentui/solid exports (scripts/check-tui.mjs).
      - name: Check the built plugin
        run: |
          node -e "const p = require('./package.json'); if (!p.exports['./tui'].endsWith('.js')) throw new Error('./tui must point at compiled JavaScript')"
          node --check dist/tui.js
          node scripts/check-tui.mjs dist/tui.js
          node -e "import('./dist/index.js').then((m) => { if (typeof m.default !== 'object') process.exit(1) })"

      - name: Check the package contents
        run: npm pack --dry-run --ignore-scripts
